<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="
    margin: 0; /*this line removes the default space around the body*/
    background-color: #ffffff;
    height: 100vh; /*Make the body a 100% of the viewport height*/
    display: flex; /*Enables the flexbox layout*/
    justify-content: center; /*Centering the content horizontal*/
    align-items: center; /*Centering the content vertically*/
    ">
    

    <div style="
    background-color: black;
    padding: 10px;
    ">
        <div style="
        border: 5px solid white;
        text-align: center;
        background-color: black;
        padding: 10px 25px;
        ">
            <h1 style="
            margin: 0px;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 80px;
            font-weight: 800; /*Font heavier*/
            letter-spacing: 5px;
            ">
            <i>Oasis</i></h1>
        </div>
    </div>
</body>
</html>
